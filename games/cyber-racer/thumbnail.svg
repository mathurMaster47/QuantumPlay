<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="racerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11081f"/>
      <stop offset="60%" stop-color="#2d0b36"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#racerBg)"/>

  <!-- Perspective Highway Road Grid -->
  <polygon points="120,40 280,40 380,240 20,240" fill="#090d16" stroke="#f43f5e" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="40" x2="200" y2="240" stroke="#fbbf24" stroke-width="3" stroke-dasharray="16 12"/>
  <line x1="160" y1="40" x2="110" y2="240" stroke="#f43f5e" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
  <line x1="240" y1="40" x2="290" y2="240" stroke="#f43f5e" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Nitro Speed Particles -->
  <line x1="80" y1="20" x2="80" y2="220" stroke="#f43f5e" stroke-width="2" opacity="0.3" stroke-dasharray="20 40"/>
  <line x1="320" y1="10" x2="320" y2="230" stroke="#f43f5e" stroke-width="2" opacity="0.3" stroke-dasharray="30 30"/>

  <!-- Cyber Race Car -->
  <g transform="translate(200, 155)">
    <!-- Nitro Exhaust Flames -->
    <polygon points="-8,30 0,55 8,30" fill="#f43f5e" filter="url(#redGlow)"/>
    <polygon points="-4,30 0,45 4,30" fill="#fbbf24"/>
    <!-- Wheels -->
    <rect x="-26" y="-15" width="8" height="18" rx="3" fill="#334155"/>
    <rect x="18" y="-15" width="8" height="18" rx="3" fill="#334155"/>
    <rect x="-28" y="15" width="9" height="20" rx="3" fill="#334155"/>
    <rect x="19" y="15" width="9" height="20" rx="3" fill="#334155"/>
    <!-- Car Body -->
    <path d="M -20,25 L -18,-10 L 0,-30 L 18,-10 L 20,25 Z" fill="#f43f5e" filter="url(#redGlow)"/>
    <path d="M -12,5 L 0,-15 L 12,5 Z" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Title Text overlay -->
  <text x="200" y="222" text-anchor="middle" fill="#fb7185" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="800" font-size="16" letter-spacing="3">CYBER TURBO RACER</text>
</svg>
