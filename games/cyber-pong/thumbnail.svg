<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pongBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#pongBg)"/>

  <!-- Dashed Center Net -->
  <line x1="200" y1="10" x2="200" y2="230" stroke="#34d399" stroke-width="2" stroke-dasharray="10 10" opacity="0.4"/>

  <!-- Player Paddle (Emerald) -->
  <rect x="40" y="70" width="12" height="80" rx="6" fill="#10b981" filter="url(#neonGlow)"/>

  <!-- AI Paddle (Rose) -->
  <rect x="348" y="100" width="12" height="80" rx="6" fill="#f43f5e" filter="url(#neonGlow)"/>

  <!-- Laser Ball with Motion Trail -->
  <line x1="100" y1="130" x2="240" y2="90" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>
  <circle cx="240" cy="90" r="10" fill="#ffffff" filter="url(#neonGlow)"/>

  <!-- Score Markers -->
  <text x="150" y="50" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="32" fill="#10b981" opacity="0.8">3</text>
  <text x="230" y="50" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="32" fill="#f43f5e" opacity="0.8">1</text>

  <!-- Title Text overlay -->
  <text x="200" y="215" text-anchor="middle" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16" letter-spacing="2">CYBER PONG 2099</text>
</svg>
