<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="rocketGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="asteroid" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#spaceBg)"/>

  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="120" cy="80" r="1" fill="#818cf8" opacity="0.6"/>
  <circle cx="280" cy="30" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="340" cy="110" r="1" fill="#c084fc" opacity="0.7"/>
  <circle cx="90" cy="180" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="310" cy="190" r="2" fill="#818cf8" opacity="0.8"/>

  <!-- Speed Lines -->
  <line x1="60" y1="0" x2="60" y2="240" stroke="#6366f1" stroke-width="1" opacity="0.2" stroke-dasharray="8 12"/>
  <line x1="200" y1="0" x2="200" y2="240" stroke="#818cf8" stroke-width="1.5" opacity="0.3" stroke-dasharray="12 8"/>
  <line x1="330" y1="0" x2="330" y2="240" stroke="#6366f1" stroke-width="1" opacity="0.2" stroke-dasharray="6 10"/>

  <!-- Asteroid -->
  <circle cx="110" cy="70" r="22" fill="url(#asteroid)"/>
  <circle cx="290" cy="140" r="16" fill="url(#asteroid)"/>

  <!-- Player Ship -->
  <g transform="translate(200, 160)">
    <!-- Engine Flame -->
    <polygon points="-6,25 0,42 6,25" fill="#fbbf24" opacity="0.9"/>
    <polygon points="-3,25 0,35 3,25" fill="#f97316"/>
    <!-- Ship Body -->
    <polygon points="0,-25 18,20 -18,20" fill="url(#rocketGlow)"/>
    <polygon points="0,-20 8,15 -8,15" fill="#c7d2fe"/>
    <!-- Wings -->
    <polygon points="-18,10 -30,22 -15,20" fill="#3730a3"/>
    <polygon points="18,10 30,22 15,20" fill="#3730a3"/>
  </g>

  <!-- Title Text overlay -->
  <text x="200" y="215" text-anchor="middle" fill="#e0e7ff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16" letter-spacing="2">SPACE NEO-RUNNER</text>
</svg>
