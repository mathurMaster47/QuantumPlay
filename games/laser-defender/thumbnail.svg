<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="defenderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#defenderBg)"/>

  <!-- Alien Fleet -->
  <g transform="translate(100, 50)">
    <polygon points="0,0 15,15 30,0 15,30" fill="#a855f7" filter="url(#purpleGlow)"/>
  </g>
  <g transform="translate(185, 40)">
    <polygon points="0,0 15,15 30,0 15,30" fill="#c084fc" filter="url(#purpleGlow)"/>
  </g>
  <g transform="translate(270, 50)">
    <polygon points="0,0 15,15 30,0 15,30" fill="#a855f7" filter="url(#purpleGlow)"/>
  </g>

  <!-- Laser Beams -->
  <line x1="200" y1="160" x2="200" y2="70" stroke="#f0abfc" stroke-width="4" filter="url(#purpleGlow)"/>

  <!-- Cannon Ship -->
  <g transform="translate(200, 180)">
    <path d="M -25,20 L 0,-15 L 25,20 L 10,15 L -10,15 Z" fill="#e879f9" filter="url(#purpleGlow)"/>
    <rect x="-3" y="-22" width="6" height="10" fill="#ffffff"/>
  </g>

  <!-- Title Text overlay -->
  <text x="200" y="220" text-anchor="middle" fill="#f5d0fe" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16" letter-spacing="2">LASER DEFENDER</text>
</svg>
